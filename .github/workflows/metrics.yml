name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Overview · top languages · achievements  (replaces stats, top-langs, trophies)
      - name: Overview metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: idiocter
          filename: metrics.svg
          template: classic
          base: header
          config_timezone: Asia/Kathmandu
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0

      # Isometric contribution calendar  (replaces the activity graph)
      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: idiocter
          filename: metrics.isocalendar.svg
          base: ""
          config_timezone: Asia/Kathmandu
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
